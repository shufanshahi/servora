server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: unknown paths fall back to index.html so deep links work.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the entry points, so a new deployment is picked up immediately.
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /flutter_service_worker.js { add_header Cache-Control "no-cache"; }
    location = /main.dart.js { add_header Cache-Control "no-cache"; }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;
}
