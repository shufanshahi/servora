# Backend stack: PostgreSQL (and, once added, the API).
# Run on its own from this folder:  docker compose up -d
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-servora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-servora}
      POSTGRES_DB: ${POSTGRES_DB:-servora}
    ports:
      # Host port 5433 avoids clashing with a locally installed PostgreSQL on 5432.
      - '${DB_HOST_PORT:-5433}:5432'
    volumes:
      - servora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  servora_pgdata:
