openapi: 3.0.3
info:
  title: Servora API
  version: 0.1.0
  description: |
    REST API for Servora, a service booking and management app.

    Every response is JSON. Successful responses use `{ "success": true, "data": ... }`
    (list responses add `meta`); failures use `{ "success": false, "error": { ... } }`.
    Protected routes need an `Authorization: Bearer <accessToken>` header.
servers:
  - url: http://localhost:3000
    description: Local development
tags:
  - name: Health
  - name: Auth
    description: Registration and login. Both are rate limited per client IP.
  - name: Services
    description: The public service catalogue. No token needed.
  - name: Appointments
    description: Booking a service and managing your own bookings. A token is required.

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness check
      operationId: getHealth
      responses:
        '200':
          description: The API is running.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      status: { type: string, example: ok }
                      uptimeSeconds: { type: integer, example: 42 }

  /auth/register:
    post:
      tags: [Auth]
      summary: Create an account
      description: |
        Creates a user and signs them in. Emails are compared case-insensitively.
        Passwords need at least 8 characters, a letter and a number (72 bytes at most).
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              name: Ada Lovelace
              email: ada@example.com
              password: Sup3rSecret
      responses:
        '201':
          description: Account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                success: true
                data:
                  user:
                    id: 3f0c9f2e-6a7c-4b0e-9a55-1d2f6e8a1c11
                    name: Ada Lovelace
                    email: ada@example.com
                    createdAt: '2026-11-17T10:00:00.000Z'
                  accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIzZjBjLi4uIn0.signature
                  expiresAt: '2026-11-24T10:00:00.000Z'
        '409':
          description: An account with this email already exists (`EMAIL_TAKEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: EMAIL_TAKEN
                  message: An account with this email already exists
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in
      description: |
        Returns an access token valid for 7 days. A wrong password and an unknown email
        produce the same `INVALID_CREDENTIALS` response, so registered emails are not revealed.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: ada@example.com
              password: Sup3rSecret
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                success: true
                data:
                  user:
                    id: 3f0c9f2e-6a7c-4b0e-9a55-1d2f6e8a1c11
                    name: Ada Lovelace
                    email: ada@example.com
                    createdAt: '2026-11-17T10:00:00.000Z'
                  accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIzZjBjLi4uIn0.signature
                  expiresAt: '2026-11-24T10:00:00.000Z'
        '401':
          description: Wrong email or password (`INVALID_CREDENTIALS`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: INVALID_CREDENTIALS
                  message: Incorrect email or password
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /services:
    get:
      tags: [Services]
      summary: List and search services
      description: |
        Public (no token needed). Returns active services, 20 per page by default, ordered by
        name. Filters combine with AND. `sort=popular` lists the most-booked services first
        (cancelled bookings do not count, ties fall back to name) and ignores `order`.
      operationId: listServices
      parameters:
        - name: q
          in: query
          description: Case-insensitive text search over name and description. `%` and `_` are plain characters.
          schema: { type: string, maxLength: 100 }
          example: massage
        - name: category
          in: query
          description: Exact category, case-insensitive.
          schema: { type: string, maxLength: 50 }
          example: Wellness
        - name: minPrice
          in: query
          description: Lowest price, inclusive.
          schema: { type: number, minimum: 0 }
          example: 40
        - name: maxPrice
          in: query
          description: Highest price, inclusive. Must not be below `minPrice`.
          schema: { type: number, minimum: 0 }
          example: 70
        - name: featured
          in: query
          description: "`true` for featured services only, `false` for the rest."
          schema: { type: boolean }
        - name: sort
          in: query
          schema: { type: string, enum: [name, price, popular], default: name }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          description: Page size (1-50).
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: A page of services. An empty `data` array with `total` 0 means nothing matched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceListResponse'
              example:
                success: true
                data:
                  - id: 5b2a4c1e-8f3d-4e7a-9c11-2d6f0a7b3e90
                    name: Swedish Massage
                    description: A relaxing full-body massage using long, flowing strokes to ease muscle tension, improve circulation and calm the mind. Suitable for first-time clients.
                    price: 65
                    durationMinutes: 60
                    category: Wellness
                    imageUrl: http://localhost:3000/images/services/swedish-massage.jpg
                    isFeatured: true
                meta:
                  page: 1
                  limit: 20
                  total: 1
        '422':
          $ref: '#/components/responses/ValidationError'

  /services/{id}:
    get:
      tags: [Services]
      summary: Get one service
      description: |
        Public (no token needed). Unknown, inactive and malformed ids all return the same
        `404 NOT_FOUND`.
      operationId: getService
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The complete service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
              example:
                success: true
                data:
                  id: 5b2a4c1e-8f3d-4e7a-9c11-2d6f0a7b3e90
                  name: Swedish Massage
                  description: A relaxing full-body massage using long, flowing strokes to ease muscle tension, improve circulation and calm the mind. Suitable for first-time clients.
                  price: 65
                  durationMinutes: 60
                  category: Wellness
                  imageUrl: http://localhost:3000/images/services/swedish-massage.jpg
                  isFeatured: true
        '404':
          $ref: '#/components/responses/NotFound'

  /services/{id}/availability:
    get:
      tags: [Services]
      summary: Bookable start times for a service on one day
      description: |
        Public (no token needed). Returns every start time on the day's grid whose full
        duration fits before closing, each flagged `available` or not. A slot is unavailable
        when it overlaps an active booking of this service, starts in the past or sooner than
        the minimum lead time, or lies beyond the booking horizon. Cancelled bookings free
        their slot. `date` is a calendar day in the business time zone (`timeZone` in the
        response); `startsAt` and `endsAt` are UTC instants and `label` is the local start time.
        A date before today or after the horizon is a `422`. Unknown, inactive and malformed
        service ids are `404`.
      operationId: getAvailability
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: date
          in: query
          required: true
          description: Calendar day, `YYYY-MM-DD`, in the business time zone.
          schema: { type: string, format: date }
          example: '2030-05-06'
      responses:
        '200':
          description: The day's slots in time order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityResponse'
              example:
                success: true
                data:
                  serviceId: 5b2a4c1e-8f3d-4e7a-9c11-2d6f0a7b3e90
                  date: '2030-05-06'
                  timeZone: UTC
                  durationMinutes: 60
                  slots:
                    - startsAt: '2030-05-06T09:00:00.000Z'
                      endsAt: '2030-05-06T10:00:00.000Z'
                      label: '09:00'
                      available: true
                    - startsAt: '2030-05-06T09:30:00.000Z'
                      endsAt: '2030-05-06T10:30:00.000Z'
                      label: '09:30'
                      available: false
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /appointments:
    post:
      tags: [Appointments]
      summary: Book a service
      description: |
        Creates a `PENDING` appointment for the signed-in user. `startsAt` must be a slot
        start from the availability endpoint (on the grid, inside opening hours, finishing by
        closing time, not in the past or inside the lead time, within the horizon). The end
        time is the start plus the service duration and the price is copied from the service
        at this moment. Two overlapping bookings of one service can never both succeed, even
        when sent simultaneously: the loser gets `409 SLOT_UNAVAILABLE`.
      operationId: createAppointment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppointmentRequest'
            example:
              serviceId: 5b2a4c1e-8f3d-4e7a-9c11-2d6f0a7b3e90
              startsAt: '2030-05-06T10:00:00Z'
              note: Please use unscented oil
      responses:
        '201':
          description: The new appointment, in `PENDING` status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentResponse'
              example:
                success: true
                data:
                  id: 0c6f3a52-61d4-4b0e-8d77-3a9b1f2e4c10
                  service:
                    id: 5b2a4c1e-8f3d-4e7a-9c11-2d6f0a7b3e90
                    name: Swedish Massage
                    category: Wellness
                    durationMinutes: 60
                    imageUrl: http://localhost:3000/images/services/swedish-massage.jpg
                  startsAt: '2030-05-06T10:00:00.000Z'
                  endsAt: '2030-05-06T11:00:00.000Z'
                  status: PENDING
                  price: 65
                  note: Please use unscented oil
                  createdAt: '2030-05-01T08:00:00.000Z'
                  cancelledAt: null
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The time overlaps an active booking of this service (`SLOT_UNAVAILABLE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: SLOT_UNAVAILABLE
                  message: That time is no longer available
        '422':
          $ref: '#/components/responses/ValidationError'
    get:
      tags: [Appointments]
      summary: List your appointments
      description: |
        Only the signed-in user's appointments, each with a service summary. `scope=upcoming`
        returns pending and confirmed bookings starting now or later, soonest first.
        `scope=previous` returns completed and cancelled ones plus any that already started,
        newest first. Without a scope everything is returned, newest start first. Statuses
        are brought up to date before the list is built.
      operationId: listAppointments
      security:
        - bearerAuth: []
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [upcoming, previous] }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          description: Page size (1-50).
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: A page of appointments. An empty `data` array means there are none.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentListResponse'
              example:
                success: true
                data:
                  - id: 0c6f3a52-61d4-4b0e-8d77-3a9b1f2e4c10
                    service:
                      id: 5b2a4c1e-8f3d-4e7a-9c11-2d6f0a7b3e90
                      name: Swedish Massage
                      category: Wellness
                      durationMinutes: 60
                      imageUrl: http://localhost:3000/images/services/swedish-massage.jpg
                    startsAt: '2030-05-06T10:00:00.000Z'
                    endsAt: '2030-05-06T11:00:00.000Z'
                    status: CONFIRMED
                    price: 65
                    note: null
                    createdAt: '2030-05-01T08:00:00.000Z'
                    cancelledAt: null
                meta:
                  page: 1
                  limit: 20
                  total: 1
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'

  /appointments/{id}:
    get:
      tags: [Appointments]
      summary: Get one of your appointments
      description: |
        Another user's appointment, an unknown id and a malformed id all return the same
        `404 NOT_FOUND`.
      operationId: getAppointment
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The appointment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /appointments/{id}/cancel:
    patch:
      tags: [Appointments]
      summary: Cancel a pending appointment
      description: |
        Allowed only while the appointment is `PENDING`. Confirmed, completed and already
        cancelled appointments return `409 INVALID_STATUS_TRANSITION` and stay unchanged.
        Cancelling frees the time slot. Another user's appointment is a `404`.
      operationId: cancelAppointment
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The appointment, now `CANCELLED` with `cancelledAt` set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The appointment is not pending (`INVALID_STATUS_TRANSITION`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: INVALID_STATUS_TRANSITION
                  message: A confirmed appointment cannot be cancelled; only pending ones can

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token from `/auth/register` or `/auth/login`. Missing, malformed, tampered
        or expired tokens get `401 UNAUTHENTICATED`.

  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Ada Lovelace
        email:
          type: string
          format: email
          maxLength: 254
          example: ada@example.com
        password:
          type: string
          minLength: 8
          description: At least 8 characters with a letter and a number; at most 72 bytes.
          example: Sup3rSecret
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, example: ada@example.com }
        password: { type: string, example: Sup3rSecret }
    User:
      type: object
      required: [id, name, email, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        createdAt: { type: string, format: date-time }
    AuthResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          required: [user, accessToken, expiresAt]
          properties:
            user:
              $ref: '#/components/schemas/User'
            accessToken:
              type: string
              description: 'JWT to send as `Authorization: Bearer <accessToken>`.'
            expiresAt:
              type: string
              format: date-time
    Service:
      type: object
      required: [id, name, description, price, durationMinutes, category, imageUrl, isFeatured]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        price:
          type: number
          description: Decimal amount, for example 65 or 49.99.
        durationMinutes: { type: integer, description: Estimated length of the appointment. }
        category: { type: string }
        imageUrl:
          type: string
          format: uri
          nullable: true
          description: Absolute URL of the service image, or null if it has none.
        isFeatured: { type: boolean }
    PageMeta:
      type: object
      required: [page, limit, total]
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer, description: Items matching the request across all pages. }
    ServiceResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          $ref: '#/components/schemas/Service'
    ServiceListResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items:
            $ref: '#/components/schemas/Service'
        meta:
          $ref: '#/components/schemas/PageMeta'
    AppointmentService:
      type: object
      required: [id, name, category, durationMinutes, imageUrl]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        category: { type: string }
        durationMinutes: { type: integer }
        imageUrl: { type: string, nullable: true }
    Appointment:
      type: object
      required: [id, service, startsAt, endsAt, status, price, note, createdAt, cancelledAt]
      properties:
        id: { type: string, format: uuid }
        service:
          $ref: '#/components/schemas/AppointmentService'
        startsAt: { type: string, format: date-time, description: UTC instant. }
        endsAt: { type: string, format: date-time }
        status:
          type: string
          enum: [PENDING, CONFIRMED, COMPLETED, CANCELLED]
          description: |
            PENDING becomes CONFIRMED automatically after a short delay, CONFIRMED becomes
            COMPLETED once the end time passes, and PENDING can be cancelled. CANCELLED and
            COMPLETED are final.
        price: { type: number, description: 'Price when the booking was made, as a decimal amount.' }
        note: { type: string, nullable: true, maxLength: 500 }
        createdAt: { type: string, format: date-time }
        cancelledAt: { type: string, format: date-time, nullable: true }
    CreateAppointmentRequest:
      type: object
      required: [serviceId, startsAt]
      properties:
        serviceId: { type: string, format: uuid }
        startsAt:
          type: string
          format: date-time
          description: ISO 8601 with a time zone offset or `Z`. Must be a slot start.
        note: { type: string, maxLength: 500 }
    AppointmentResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          $ref: '#/components/schemas/Appointment'
    AppointmentListResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items:
            $ref: '#/components/schemas/Appointment'
        meta:
          $ref: '#/components/schemas/PageMeta'
    Slot:
      type: object
      required: [startsAt, endsAt, label, available]
      properties:
        startsAt: { type: string, format: date-time, description: UTC instant. }
        endsAt: { type: string, format: date-time }
        label: { type: string, description: 'Start time in the business time zone, as HH:mm.', example: '09:30' }
        available: { type: boolean }
    Availability:
      type: object
      required: [serviceId, date, timeZone, durationMinutes, slots]
      properties:
        serviceId: { type: string, format: uuid }
        date: { type: string, format: date }
        timeZone: { type: string, description: 'IANA zone the date and labels refer to.', example: UTC }
        durationMinutes: { type: integer }
        slots:
          type: array
          items:
            $ref: '#/components/schemas/Slot'
    AvailabilityResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          $ref: '#/components/schemas/Availability'
    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string, example: password }
        message: { type: string, example: Password must contain a number }
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable code (see the README error table).
              example: VALIDATION_ERROR
            message: { type: string }
            details:
              type: array
              description: Present for validation failures.
              items:
                $ref: '#/components/schemas/FieldError'

  responses:
    Unauthenticated:
      description: Missing, malformed, tampered or expired token (`UNAUTHENTICATED`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: UNAUTHENTICATED
              message: Authentication required
    NotFound:
      description: The resource does not exist (`NOT_FOUND`). Used for unknown, inactive, malformed and not-yours ids alike.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: NOT_FOUND
              message: Service not found
    ValidationError:
      description: Input failed validation (`VALIDATION_ERROR`), with one entry per field.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: VALIDATION_ERROR
              message: Validation failed
              details:
                - field: password
                  message: Password must contain a number
    RateLimited:
      description: Too many register/login attempts from this IP (`RATE_LIMITED`).
      headers:
        Retry-After:
          description: Seconds to wait before trying again.
          schema: { type: integer }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: RATE_LIMITED
              message: Too many requests, please try again later
