openapi: 3.0.3
info:
  title: Servora API
  version: 0.1.0
  description: |
    REST API for Servora, a service booking and management app.

    Every response is JSON. Successful responses use `{ "success": true, "data": ... }`
    (list responses add `meta`); failures use `{ "success": false, "error": { ... } }`.
    Protected routes need an `Authorization: Bearer <accessToken>` header.
servers:
  - url: http://localhost:3000
    description: Local development
tags:
  - name: Health
  - name: Auth
    description: Registration and login. Both are rate limited per client IP.
  - name: Services
    description: The public service catalogue. No token needed.

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness check
      operationId: getHealth
      responses:
        '200':
          description: The API is running.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      status: { type: string, example: ok }
                      uptimeSeconds: { type: integer, example: 42 }

  /auth/register:
    post:
      tags: [Auth]
      summary: Create an account
      description: |
        Creates a user and signs them in. Emails are compared case-insensitively.
        Passwords need at least 8 characters, a letter and a number (72 bytes at most).
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              name: Ada Lovelace
              email: ada@example.com
              password: Sup3rSecret
      responses:
        '201':
          description: Account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                success: true
                data:
                  user:
                    id: 3f0c9f2e-6a7c-4b0e-9a55-1d2f6e8a1c11
                    name: Ada Lovelace
                    email: ada@example.com
                    createdAt: '2026-11-17T10:00:00.000Z'
                  accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIzZjBjLi4uIn0.signature
                  expiresAt: '2026-11-24T10:00:00.000Z'
        '409':
          description: An account with this email already exists (`EMAIL_TAKEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: EMAIL_TAKEN
                  message: An account with this email already exists
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in
      description: |
        Returns an access token valid for 7 days. A wrong password and an unknown email
        produce the same `INVALID_CREDENTIALS` response, so registered emails are not revealed.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: ada@example.com
              password: Sup3rSecret
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                success: true
                data:
                  user:
                    id: 3f0c9f2e-6a7c-4b0e-9a55-1d2f6e8a1c11
                    name: Ada Lovelace
                    email: ada@example.com
                    createdAt: '2026-11-17T10:00:00.000Z'
                  accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIzZjBjLi4uIn0.signature
                  expiresAt: '2026-11-24T10:00:00.000Z'
        '401':
          description: Wrong email or password (`INVALID_CREDENTIALS`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: INVALID_CREDENTIALS
                  message: Incorrect email or password
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /services:
    get:
      tags: [Services]
      summary: List and search services
      description: |
        Public (no token needed). Returns active services, 20 per page by default, ordered by
        name. Filters combine with AND. `sort=popular` currently orders by name until bookings
        exist to rank by.
      operationId: listServices
      parameters:
        - name: q
          in: query
          description: Case-insensitive text search over name and description. `%` and `_` are plain characters.
          schema: { type: string, maxLength: 100 }
          example: massage
        - name: category
          in: query
          description: Exact category, case-insensitive.
          schema: { type: string, maxLength: 50 }
          example: Wellness
        - name: minPrice
          in: query
          description: Lowest price, inclusive.
          schema: { type: number, minimum: 0 }
          example: 40
        - name: maxPrice
          in: query
          description: Highest price, inclusive. Must not be below `minPrice`.
          schema: { type: number, minimum: 0 }
          example: 70
        - name: featured
          in: query
          description: "`true` for featured services only, `false` for the rest."
          schema: { type: boolean }
        - name: sort
          in: query
          schema: { type: string, enum: [name, price, popular], default: name }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          description: Page size (1-50).
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: A page of services. An empty `data` array with `total` 0 means nothing matched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceListResponse'
              example:
                success: true
                data:
                  - id: 5b2a4c1e-8f3d-4e7a-9c11-2d6f0a7b3e90
                    name: Swedish Massage
                    description: A relaxing full-body massage using long, flowing strokes to ease muscle tension, improve circulation and calm the mind. Suitable for first-time clients.
                    price: 65
                    durationMinutes: 60
                    category: Wellness
                    imageUrl: http://localhost:3000/images/services/swedish-massage.jpg
                    isFeatured: true
                meta:
                  page: 1
                  limit: 20
                  total: 1
        '422':
          $ref: '#/components/responses/ValidationError'

  /services/{id}:
    get:
      tags: [Services]
      summary: Get one service
      description: |
        Public (no token needed). Unknown, inactive and malformed ids all return the same
        `404 NOT_FOUND`.
      operationId: getService
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The complete service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
              example:
                success: true
                data:
                  id: 5b2a4c1e-8f3d-4e7a-9c11-2d6f0a7b3e90
                  name: Swedish Massage
                  description: A relaxing full-body massage using long, flowing strokes to ease muscle tension, improve circulation and calm the mind. Suitable for first-time clients.
                  price: 65
                  durationMinutes: 60
                  category: Wellness
                  imageUrl: http://localhost:3000/images/services/swedish-massage.jpg
                  isFeatured: true
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token from `/auth/register` or `/auth/login`. Missing, malformed, tampered
        or expired tokens get `401 UNAUTHENTICATED`.

  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Ada Lovelace
        email:
          type: string
          format: email
          maxLength: 254
          example: ada@example.com
        password:
          type: string
          minLength: 8
          description: At least 8 characters with a letter and a number; at most 72 bytes.
          example: Sup3rSecret
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, example: ada@example.com }
        password: { type: string, example: Sup3rSecret }
    User:
      type: object
      required: [id, name, email, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        createdAt: { type: string, format: date-time }
    AuthResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          required: [user, accessToken, expiresAt]
          properties:
            user:
              $ref: '#/components/schemas/User'
            accessToken:
              type: string
              description: 'JWT to send as `Authorization: Bearer <accessToken>`.'
            expiresAt:
              type: string
              format: date-time
    Service:
      type: object
      required: [id, name, description, price, durationMinutes, category, imageUrl, isFeatured]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        price:
          type: number
          description: Decimal amount, for example 65 or 49.99.
        durationMinutes: { type: integer, description: Estimated length of the appointment. }
        category: { type: string }
        imageUrl:
          type: string
          format: uri
          nullable: true
          description: Absolute URL of the service image, or null if it has none.
        isFeatured: { type: boolean }
    PageMeta:
      type: object
      required: [page, limit, total]
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer, description: Services matching the filters across all pages. }
    ServiceResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          $ref: '#/components/schemas/Service'
    ServiceListResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items:
            $ref: '#/components/schemas/Service'
        meta:
          $ref: '#/components/schemas/PageMeta'
    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string, example: password }
        message: { type: string, example: Password must contain a number }
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable code (see the README error table).
              example: VALIDATION_ERROR
            message: { type: string }
            details:
              type: array
              description: Present for validation failures.
              items:
                $ref: '#/components/schemas/FieldError'

  responses:
    NotFound:
      description: The resource does not exist (`NOT_FOUND`). Used for unknown, inactive and malformed ids alike.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: NOT_FOUND
              message: Service not found
    ValidationError:
      description: Input failed validation (`VALIDATION_ERROR`), with one entry per field.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: VALIDATION_ERROR
              message: Validation failed
              details:
                - field: password
                  message: Password must contain a number
    RateLimited:
      description: Too many register/login attempts from this IP (`RATE_LIMITED`).
      headers:
        Retry-After:
          description: Seconds to wait before trying again.
          schema: { type: integer }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: RATE_LIMITED
              message: Too many requests, please try again later
