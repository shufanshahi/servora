# Root compose: runs the whole Servora stack together.
#   - db   PostgreSQL            (host port 5433)
#   - api  Node.js REST API      (http://localhost:3000, docs at /docs)
#   - web  Flutter web app/nginx (http://localhost:8080)
#
#   cp backend/.env.example backend/.env     # once
#   docker compose up -d --build --wait
#
# Each part also starts on its own from its folder: backend/ and frontend/.
include:
  - backend/docker-compose.yml
  - frontend/docker-compose.yml
