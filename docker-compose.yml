# Backend stack: PostgreSQL and the API.
# Run on its own from this folder:  docker compose up --build
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-servora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-servora}
      POSTGRES_DB: ${POSTGRES_DB:-servora}
    ports:
      # Host port 5433 avoids clashing with a locally installed PostgreSQL on 5432.
      - '${DB_HOST_PORT:-5433}:5432'
    volumes:
      - servora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # This compose file is for local use, so it defaults to development mode (which
      # allows the example secret). A real deployment sets NODE_ENV=production and its own
      # JWT_SECRET.
      NODE_ENV: ${NODE_ENV:-development}
      PORT: '3000'
      DATABASE_URL: postgres://${POSTGRES_USER:-servora}:${POSTGRES_PASSWORD:-servora}@db:5432/${POSTGRES_DB:-servora}
      # Required. Put it in backend/.env (copy .env.example) or export it.
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET - copy backend/.env.example to backend/.env}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-604800}
      BCRYPT_COST: ${BCRYPT_COST:-12}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-900}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
    ports:
      - '${API_HOST_PORT:-3000}:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/health >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  servora_pgdata:
