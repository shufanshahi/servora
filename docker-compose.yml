# Servora web app on its own (nginx serving the Flutter web build).
# Run from this folder:  docker compose up --build
# It needs the API to be running too (see ../backend or the root docker-compose.yml).
services:
  web:
    build:
      context: .
      args:
        # Where the user's *browser* finds the API. Rebuild the image after changing it.
        API_BASE_URL: ${API_BASE_URL:-http://localhost:3000}
    restart: unless-stopped
    ports:
      - '${WEB_HOST_PORT:-8080}:80'
